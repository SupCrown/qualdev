<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UsTom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>UsTom</h1>
    <p class="tagline">Mot de 4 à 8 lettres (aléatoire) · 1<sup>re</sup> lettre donnée au départ · 5 essais · rouge / jaune / gris</p>

    <div id="statusBanner" class="status-banner" hidden></div>

    <section class="board-wrap" aria-label="Grille des tentatives">
        <div id="board" class="board"></div>
    </section>

    <div class="input-zone">
        <label class="sr-only" for="wordInput">Votre mot</label>
        <input
            type="text"
            id="wordInput"
            placeholder="Votre mot"
            autocomplete="off"
            spellcheck="false"
            maxlength="32"
            inputmode="text"
        >
        <button type="button" id="sendBtn">Valider</button>
        <button type="button" id="newGameBtn" class="secondary" hidden>Nouvelle partie</button>
    </div>

    <p id="errorLine" class="error-line" role="alert" hidden></p>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="app.js"></script>
</body>
</html>
