<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tusmo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tusmo</h1>
    <p class="tagline">5 lettres · 5 essais · rouge = bonne place · jaune = mauvaise place · gris = absent</p>

    <div id="statusBanner" class="status-banner" hidden></div>

    <section class="board-wrap" aria-label="Grille des tentatives">
        <div id="board" class="board"></div>
    </section>

    <div class="input-zone">
        <label class="sr-only" for="wordInput">Votre mot</label>
        <input
            type="text"
            id="wordInput"
            placeholder="Mot à 5 lettres"
            autocomplete="off"
            spellcheck="false"
            maxlength="5"
            inputmode="text"
        >
        <button type="button" id="sendBtn">Valider</button>
        <button type="button" id="newGameBtn" class="secondary" hidden>Nouvelle partie</button>
    </div>

    <p id="errorLine" class="error-line" role="alert" hidden></p>

    <script src="app.js"></script>
</body>
</html>
