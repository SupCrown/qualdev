[package]
name = "word_service"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.2"

[build-dependencies]
tonic-prost-build = "0.14.2"
